<style>
:root{
  color-scheme:light;
  --surface:#fcfcfb;
  --plane:#f9f9f7;
  --ink:#0b0b0b;
  --ink-2:#52514e;
  --muted:#898781;
  --grid:#e1e0d9;
  --border:rgba(11,11,11,0.10);
  --accent:#2a78d6;
  --accent-ink:#ffffff;
  --good:#0ca30c;
  --critical:#d03b3b;
  --warning:#c98500;
  --cat-p:#0a7d0a;
  --cat-ap:#c9591f;
  --cat-anp:#c23a3a;
  --cat-v:#2a78d6;
  --cat-ce:#4a3aa7;
  --cat-baja:#b23e73;
  --cat-blank:#898781;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#c98500; --s5:#e87ba4; --s6:#4a3aa7;
  --shadow:0 1px 2px rgba(11,11,11,0.06), 0 6px 16px rgba(11,11,11,0.06);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --surface:#1a1a19; --plane:#0d0d0d; --ink:#ffffff; --ink-2:#c3c2b7; --muted:#8f8d87;
    --grid:#2c2c2a; --border:rgba(255,255,255,0.12); --accent:#3987e5; --accent-ink:#ffffff;
    --good:#3fca3f; --critical:#e66767; --warning:#e0a63a;
    --cat-p:#3fbf3f; --cat-ap:#e0813f; --cat-anp:#e66767; --cat-v:#5b9de8; --cat-ce:#9085e9; --cat-baja:#e590b6; --cat-blank:#9d9b95;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#e0a63a; --s5:#d55181; --s6:#9085e9;
    --shadow:0 1px 2px rgba(0,0,0,0.3), 0 6px 20px rgba(0,0,0,0.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --surface:#1a1a19; --plane:#0d0d0d; --ink:#ffffff; --ink-2:#c3c2b7; --muted:#8f8d87;
  --grid:#2c2c2a; --border:rgba(255,255,255,0.12); --accent:#3987e5; --accent-ink:#ffffff;
  --good:#3fca3f; --critical:#e66767; --warning:#e0a63a;
  --cat-p:#3fbf3f; --cat-ap:#e0813f; --cat-anp:#e66767; --cat-v:#5b9de8; --cat-ce:#9085e9; --cat-baja:#e590b6; --cat-blank:#9d9b95;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#e0a63a; --s5:#d55181; --s6:#9085e9;
  --shadow:0 1px 2px rgba(0,0,0,0.3), 0 6px 20px rgba(0,0,0,0.35);
}
*{box-sizing:border-box;}
body{background:var(--plane);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}
#root{min-height:100%;}
.app{max-width:1180px;margin:0 auto;padding:28px 20px 60px;display:flex;flex-direction:column;gap:20px;}
.masthead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.masthead-text{display:flex;flex-direction:column;gap:4px;min-width:260px;}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}
h1{font-size:24px;line-height:1.2;margin:0;font-weight:800;letter-spacing:-.01em;}
.sub{color:var(--ink-2);font-size:13.5px;margin:0;max-width:64ch;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);}
.upload-card{padding:40px 24px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;border:1.5px dashed var(--border);border-radius:16px;background:var(--surface);}
.upload-icon{width:46px;height:46px;border-radius:12px;background:var(--plane);display:flex;align-items:center;justify-content:center;color:var(--accent);}
.btn{appearance:none;border:none;border-radius:10px;padding:10px 18px;font-size:13.5px;font-weight:650;cursor:pointer;background:var(--accent);color:var(--accent-ink);}
.btn:hover{filter:brightness(1.05);}
.btn.secondary{background:transparent;color:var(--ink);border:1px solid var(--border);}
.btn.small{padding:7px 12px;font-size:12.5px;}
.hint{font-size:12px;color:var(--muted);}
.filebar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:14px 18px;}
.filebar .name{font-weight:650;font-size:13.5px;}
.filebar .meta{font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;}
.filebar .spacer{flex:1;}
.error-card{padding:20px 22px;border:1px solid color-mix(in srgb, var(--critical) 40%, var(--border));background:color-mix(in srgb, var(--critical) 8%, var(--surface));border-radius:14px;color:var(--ink);}
.error-card h2{margin:0 0 6px;font-size:15px;color:var(--critical);}
.error-card p{margin:0;font-size:13.5px;color:var(--ink-2);}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.kpi-tile{padding:16px 18px;display:flex;flex-direction:column;gap:6px;}
.kpi-label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);}
.kpi-value{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em;}
.kpi-tile.month{border-color:color-mix(in srgb, var(--accent) 35%, var(--border));}
.controls{display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px 22px;padding:18px 20px;}
.field{display:flex;flex-direction:column;gap:5px;}
.field label{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);}
select{font:inherit;font-size:13.5px;padding:8px 10px;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--ink);min-width:150px;}
.range-readout{display:flex;flex-direction:column;gap:2px;}
.range-readout .lbl{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);}
.range-readout .val{font-size:13.5px;font-variant-numeric:tabular-nums;font-weight:600;}
.status-row{display:flex;flex-wrap:wrap;gap:10px;padding:0 2px;}
.chip{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-size:12.5px;font-weight:600;color:var(--ink-2);box-shadow:var(--shadow);}
.chip .dot{width:8px;height:8px;border-radius:50%;flex:none;}
.chip.ok .dot{background:var(--good);}
.chip.bad .dot{background:var(--critical);}
.pill{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;font-size:13px;font-weight:750;letter-spacing:.02em;}
.pill.ok{background:color-mix(in srgb, var(--good) 16%, var(--surface));color:var(--good);}
.pill.bad{background:color-mix(in srgb, var(--critical) 16%, var(--surface));color:var(--critical);}
.tables-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.table-card{padding:18px 18px 8px;display:flex;flex-direction:column;gap:10px;}
.table-card h3{margin:0;font-size:13.5px;font-weight:750;}
.table-card .caption{font-size:12px;color:var(--muted);margin-top:-6px;}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
thead th{text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:0 4px 8px;border-bottom:1px solid var(--grid);}
thead th.num{text-align:right;}
tbody td{padding:8px 4px;border-bottom:1px solid var(--grid);}
tbody td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;}
tbody tr:last-child td{border-bottom:none;}
tr.total td{border-top:1.5px solid var(--ink-2);font-weight:800;padding-top:10px;}
.cat{display:inline-flex;align-items:center;gap:8px;}
.cat .dot{width:9px;height:9px;border-radius:3px;flex:none;}
.overflow-x{overflow-x:auto;}
.top-scrollbar{overflow-x:auto;overflow-y:hidden;height:14px;margin-bottom:2px;}
.footer-card{padding:18px 20px;display:flex;flex-direction:column;gap:12px;}
.footer-card h3{margin:0;font-size:13.5px;font-weight:750;}
.warn-banner{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:10px;background:color-mix(in srgb, var(--critical) 12%, var(--surface));color:var(--critical);font-size:13px;font-weight:700;}
tbody td.status{text-align:center;}

.objetivo-box{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:9px 14px;flex-shrink:0;box-shadow:var(--shadow);}
.objetivo-box label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700;}
.objetivo-box input{width:52px;border:none;background:transparent;color:var(--ink);font-size:16px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums;}
.objetivo-box input:focus{outline:2px solid var(--accent);border-radius:4px;}
.objetivo-box .pct{color:var(--ink-2);font-size:14px;}

.filters-bar{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 16px;box-shadow:var(--shadow);}
.msel{display:flex;flex-direction:column;gap:4px;position:relative;}
.msel-label{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em;}
.msel-toggle{width:190px;max-width:60vw;text-align:left;border:1px solid var(--border);background:var(--plane);color:var(--ink);border-radius:8px;padding:8px 28px 8px 10px;font-size:13px;font-family:inherit;cursor:pointer;position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.msel-toggle:hover{filter:brightness(0.97);}
.msel-toggle::after{content:"";position:absolute;right:10px;top:50%;width:7px;height:7px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:translateY(-70%) rotate(45deg);}
.msel-menu{position:absolute;top:calc(100% + 4px);left:0;z-index:40;width:260px;max-width:80vw;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:8px;}
.msel-search{width:100%;border:1px solid var(--border);background:var(--plane);color:var(--ink);border-radius:7px;padding:6px 8px;font-size:12.5px;margin-bottom:6px;font-family:inherit;}
.msel-search:focus{outline:2px solid var(--accent);}
.msel-menu-actions{display:flex;gap:8px;margin-bottom:6px;}
.msel-menu-actions button{background:none;border:none;color:var(--accent);font-size:11.5px;font-weight:700;cursor:pointer;padding:2px 0;}
.msel-menu-actions button:hover{text-decoration:underline;}
.msel-options{max-height:220px;overflow-y:auto;display:flex;flex-direction:column;gap:2px;}
.msel-opt{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2);padding:4px 4px;border-radius:6px;cursor:pointer;}
.msel-opt:hover{background:var(--plane);}
.msel-opt input{accent-color:var(--accent);width:14px;height:14px;flex-shrink:0;}
.msel-opt span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

.kgroups{display:flex;gap:12px;flex-wrap:wrap;}
.kgroup{flex:1 1 240px;background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow);}
.kgroup-head{background:var(--accent);color:var(--accent-ink);text-align:center;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:7px 8px;}
.kgroup-tiles{display:flex;flex:1;}
.ktile{flex:1;padding:14px 10px;text-align:center;display:flex;flex-direction:column;gap:5px;min-width:0;}
.ktile+.ktile{border-left:1px solid var(--border);}
.ktile .kt-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ktile .kt-value{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15;}
.kgroup.wide{flex-basis:320px;}
.kgroup.xwide{flex-basis:380px;flex-grow:2;}
.kgroup-tiles+.kgroup-tiles{border-top:1px solid var(--border);}
.kgroup-tiles.kt-detail .ktile{padding:10px 6px;}
.kgroup-tiles.kt-detail .ktile .kt-value{font-size:18px;}
.kgroup.wide .ktile .kt-value{font-size:18px;}
.kgroup-caption{font-size:12.5px;color:var(--ink-2);}
.schip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;}
.schip .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.schip.good{background:color-mix(in srgb, var(--good) 16%, var(--surface));color:var(--good);}
.schip.good .dot{background:var(--good);}
.schip.warn{background:color-mix(in srgb, var(--warning) 18%, var(--surface));color:var(--warning);}
.schip.warn .dot{background:var(--warning);}
.schip.bad{background:color-mix(in srgb, var(--critical) 16%, var(--surface));color:var(--critical);}
.schip.bad .dot{background:var(--critical);}

.motivo-settings{padding:16px 18px;display:flex;flex-direction:column;gap:8px;}
.motivo-settings h3{font-size:13px;font-weight:750;margin:0;}
.motivo-checklist{display:flex;flex-wrap:wrap;gap:8px 18px;}
.motivo-check{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);white-space:nowrap;}
.motivo-check input{accent-color:var(--accent);width:14px;height:14px;}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);overflow-x:auto;}
.tabs button{background:none;border:none;padding:10px 14px;font-size:13.5px;font-weight:650;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;cursor:pointer;font-family:inherit;}
.tabs button:hover{color:var(--ink);}
.tabs button.active{color:var(--accent);border-bottom-color:var(--accent);}
.tabpanel{display:flex;flex-direction:column;gap:16px;}

.chart-card{padding:18px 20px;display:flex;flex-direction:column;gap:6px;}
.chart-card h3{margin:0;font-size:14.5px;font-weight:750;}
.chart-card .desc{color:var(--muted);font-size:12.5px;margin:0;}
svg.chart{width:100%;height:auto;display:block;overflow:visible;margin-top:8px;}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:4px;}
.legend .item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);}
.legend .swatch{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
.legend .line{width:14px;height:2px;flex-shrink:0;}

.filter-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:4px;}

.sim-grid{display:grid;grid-template-columns:260px 1fr;gap:24px;}
@media (max-width:760px){.sim-grid{grid-template-columns:1fr;}}
.sim-field{display:flex;flex-direction:column;gap:4px;margin-bottom:14px;}
.sim-field label{font-size:12px;color:var(--muted);font-weight:650;}
.sim-field input,.sim-field select{border:1px solid var(--border);background:var(--plane);color:var(--ink);border-radius:8px;padding:8px 10px;font-size:14px;font-variant-numeric:tabular-nums;width:100%;font-family:inherit;}
.cronicos-tab input[type=text],.cronicos-tab textarea{border:1px solid var(--border);background:var(--plane);color:var(--ink);border-radius:8px;padding:8px 10px;font-size:13.5px;font-family:inherit;width:100%;}
.cronicos-tab textarea{resize:vertical;}
.cronicos-tab .field{margin-bottom:10px;}
.cronico-row-warn td{background:color-mix(in srgb, var(--warning) 20%, var(--surface));}
.cronico-row-alert td{background:color-mix(in srgb, var(--critical) 20%, var(--surface));}
.cronicos-tab td input[type=text]{min-width:110px;padding:5px 7px;font-size:12.5px;}
.login-form input{border:1px solid var(--border);background:var(--plane);color:var(--ink);border-radius:8px;padding:9px 11px;font-size:14px;font-family:inherit;width:100%;}
.sim-result{display:flex;flex-direction:column;gap:14px;justify-content:center;}
.sim-big{font-size:42px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;}
.sim-note{font-size:13px;color:var(--ink-2);line-height:1.5;background:var(--plane);border-radius:10px;padding:12px 14px;}
.sim-note b{color:var(--ink);}

.cell-link{background:none;border:none;padding:0;margin:0;font:inherit;font-variant-numeric:tabular-nums;font-weight:700;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px;}
.cell-link:hover{filter:brightness(1.2);}
tr.total-row td{border-top:1.5px solid var(--ink-2);font-weight:800;padding-top:10px;}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal-panel{background:var(--surface);border:1px solid var(--border);border-radius:14px;max-width:920px;width:100%;max-height:85vh;display:flex;flex-direction:column;gap:10px;padding:20px 22px;box-shadow:var(--shadow);}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.modal-head h3{margin:0;font-size:15px;font-weight:750;}
.modal-table-wrap{overflow:auto;max-height:50vh;border:1px solid var(--border);border-radius:8px;}
.modal-table-wrap table{font-size:12px;}
.modal-table-wrap th,.modal-table-wrap td{white-space:nowrap;padding:6px 9px;}
.modal-table-wrap thead th{position:sticky;top:0;background:var(--surface);}

.toggle-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.toggle-list{padding:0;overflow:hidden;}
.toggle-list-head{background:var(--accent);color:var(--accent-ink);text-align:center;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:9px 10px;}
.toggle-list-actions{display:flex;gap:14px;padding:8px 14px;border-bottom:1px solid var(--border);}
.toggle-list-actions button{background:none;border:none;color:var(--accent);font-size:12px;font-weight:700;cursor:pointer;padding:0;}
.toggle-list-rows{max-height:340px;overflow-y:auto;}
.toggle-list-cols{column-gap:0;}
@media (max-width:900px){.toggle-list-cols{column-count:2 !important;}}
@media (max-width:560px){.toggle-list-cols{column-count:1 !important;}}
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 14px;font-size:12.5px;color:var(--ink-2);cursor:pointer;border-bottom:1px solid var(--grid);break-inside:avoid;}
.toggle-row:hover{background:var(--plane);}
.toggle-row:last-child{border-bottom:none;}
.toggle-pill{font-size:11px;font-weight:800;padding:2px 9px;border-radius:999px;flex:none;}
.toggle-pill.yes{background:color-mix(in srgb, var(--good) 22%, var(--surface));color:var(--good);}
.toggle-pill.no{background:var(--plane);color:var(--muted);}
.ficha-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 20px;}
.ficha-grid .lbl{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;}
.ficha-grid .val{display:block;font-size:14px;font-weight:600;margin-top:2px;}
@media (max-width:760px){.toggle-grid{grid-template-columns:1fr;}}
@media (max-width:700px){.ficha-grid{grid-template-columns:1fr 1fr;}}

@media (max-width:820px){
  .kpi-grid{grid-template-columns:repeat(2,1fr);}
  .tables-grid{grid-template-columns:1fr;}
}

.print-header{display:none;}
.print-btn{margin-left:auto;}
@media print{
  body{background:#fff;color:#000;}
  .no-print{display:none !important;}
  .print-header{display:block !important;margin-bottom:14px;}
  .print-header h2{margin:0 0 4px;font-size:19px;}
  .print-header .sub{font-size:12.5px;color:#444;margin:0;}
  .card{box-shadow:none;border:1px solid #ccc;break-inside:avoid;background:#fff;color:#000;}
  .app{max-width:100%;padding:0;}
  .kt-label,.lbl,.hint,.caption,.desc{color:#444 !important;}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react" src="app.jsx"></script>
</body>
</html>
